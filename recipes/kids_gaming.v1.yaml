recipe_name: kids_gaming
version: "1.0.0"

silence:
  margin_before_sec: 0.5
  margin_after_sec: 1.0
  min_cut_sec: 4.0
  min_clip_sec: 0.1

audio:
  voice_lufs: -14.0
  game_attenuation_db: -12.0
  music_drop_sec: 2.0

ai:
  primary_model: "gemini-3.8-flash"
  fallback_models:
    - "gemini-3.6-flash"
    - "gemini-3.5-flash-lite"
  temperature: 0.0
  seed: 42
  top_p: 0.95
  same_model_retries: 1

hook:
  min_duration_sec: 8.0
  max_duration_sec: 15.0
  exclude_first_sec: 30.0
  forbid_coppa_overlap: true
  rubric: >-
    Elige el momento de mayor emoción genuina (sorpresa, victoria épica o risa intensa)
    con acción visual clara en el juego. Prohibido elegir saludos iniciales, menús,
    pantallas de carga o tramos con anuncios o alertas COPPA.

coppa:
  padding_sec: 0.5
  mitigate_severities:
    - "CRITICAL"
  inappropriate_words:
    - "idiota"
    - "estúpido"
    - "estupido"
    - "imbécil"
    - "imbecil"
    - "maldito"
    - "mierda"
    - "carajo"
    - "puto"
    - "puta"
    - "pendejo"
    - "cabrón"
    - "cabron"
    - "matar"
    - "muérete"
    - "muerete"
  pii_patterns:
    - id: "pii_full_name"
      pattern: "(?i)\\b(me llamo|mi nombre completo es|mi apellido es)\\s+[a-záéíóúñ]+"
      reason: "Mención de nombre o apellido propio (PII)"
    - id: "pii_location"
      pattern: "(?i)\\b(vivo en|mi dirección es|mi direccion es|vivo por la calle|mi casa queda en|la calle donde vivo|mi barrio es)\\b"
      reason: "Mención de dirección o ubicación física (PII)"
    - id: "pii_school"
      pattern: "(?i)\\b(estudio en el colegio|mi colegio se llama|mi escuela se llama)\\b"
      reason: "Mención de colegio o escuela (PII)"
    - id: "pii_phone"
      pattern: "(?i)(\\b(?:\\+?\\d{1,3}[\\s-]?)?(?:\\d[\\s-]?){7,10}\\b|\\b(mi número es|mi numero es|mi teléfono es|mi telefono es|mi celular es|llámenme al|llamenme al)\\b)"
      reason: "Posible número telefónico (PII)"
    - id: "pii_contact"
      pattern: "(?i)\\b(mi whatsapp|mi instagram|mi correo es|agrégame a|agregame a)\\b"
      reason: "Mención de red social o contacto personal (PII)"
